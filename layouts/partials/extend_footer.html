{{- /* 図(Mermaid)があるページだけ、Mermaid を読み込む。PaperMod のダークモードにも合わせる */ -}}
{{- if .Store.Get "hasMermaid" }}
<style>.post-content pre.mermaid{background:transparent;border:0;text-align:center;}</style>
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.esm.min.mjs';
  const dark = document.body.classList.contains('dark');
  mermaid.initialize({ startOnLoad: true, theme: dark ? 'dark' : 'default', fontFamily: 'sans-serif' });
</script>
{{- end }}
